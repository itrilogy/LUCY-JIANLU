<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="见鹿">
  <!--
    Favicon concept:
    - 鹿溪绿底：品牌
    - 键帽 + 光标：打字练习
    - S 形溪流：知识在练习中流动内化
    - 星点：源启 / 见鹿的灵感
  -->
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="stream" x1="6" y1="22" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- rounded brand tile -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>

  <!-- soft upper glow -->
  <circle cx="10" cy="9" r="8" fill="#ffffff" opacity="0.06"/>

  <!-- keyboard base -->
  <rect x="6.5" y="10" width="19" height="12.5" rx="2.2" fill="#F5F7FA" opacity="0.96"/>
  <rect x="6.5" y="10" width="19" height="12.5" rx="2.2" fill="none" stroke="#0A3F2D" stroke-opacity="0.12"/>

  <!-- key row 1 -->
  <rect x="8.2" y="11.6" width="3.4" height="3.2" rx="0.7" fill="#0D5E42" opacity="0.18"/>
  <rect x="12.3" y="11.6" width="3.4" height="3.2" rx="0.7" fill="#0D5E42" opacity="0.18"/>
  <!-- active key (practice focus) -->
  <rect x="16.4" y="11.6" width="3.4" height="3.2" rx="0.7" fill="#0D5E42"/>
  <rect x="20.5" y="11.6" width="3.4" height="3.2" rx="0.7" fill="#0D5E42" opacity="0.18"/>

  <!-- key row 2 -->
  <rect x="9.4" y="15.5" width="3.4" height="3.2" rx="0.7" fill="#0D5E42" opacity="0.18"/>
  <rect x="13.5" y="15.5" width="3.4" height="3.2" rx="0.7" fill="#0D5E42" opacity="0.18"/>
  <rect x="17.6" y="15.5" width="3.4" height="3.2" rx="0.7" fill="#0D5E42" opacity="0.18"/>

  <!-- space bar -->
  <rect x="10.2" y="19.4" width="11.6" height="1.9" rx="0.7" fill="#0D5E42" opacity="0.22"/>

  <!-- typing caret on active key -->
  <rect x="17.75" y="12.2" width="0.7" height="2" rx="0.35" fill="#00D2FF"/>

  <!-- flowing stream under keyboard: knowledge internalization -->
  <path
    d="M5.5 25.2 C9.5 23.6, 12.8 26.4, 16.2 25.1 C19.4 23.9, 22.2 24.8, 26.5 23.9"
    fill="none"
    stroke="url(#stream)"
    stroke-width="1.6"
    stroke-linecap="round"
  />

  <!-- source spark (源启) -->
  <g transform="translate(24.2 7.2)">
    <path d="M0-2.4 L0.55-0.55 L2.4 0 L0.55 0.55 L0 2.4 L-0.55 0.55 L-2.4 0 L-0.55-0.55 Z" fill="#00D2FF"/>
    <circle cx="0" cy="0" r="0.55" fill="#F5F7FA"/>
  </g>
</svg>
